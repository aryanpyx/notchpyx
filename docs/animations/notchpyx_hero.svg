<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </linearGradient>

    <!-- Island glow -->
    <radialGradient id="island-glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent badge gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <style>
      @keyframes island-morph {
        0%, 100% {
          width: 320px;
          height: 48px;
          rx: 24px;
          transform: translate(280px, 16px);
        }
        50% {
          width: 480px;
          height: 64px;
          rx: 32px;
          transform: translate(200px, 12px);
        }
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 0.4; r: 3.5px; }
        50% { opacity: 1; r: 5px; }
      }

      @keyframes eq-1 { 0%, 100% { height: 6px; } 50% { height: 22px; } }
      @keyframes eq-2 { 0%, 100% { height: 18px; } 50% { height: 8px; } }
      @keyframes eq-3 { 0%, 100% { height: 10px; } 50% { height: 26px; } }
      @keyframes eq-4 { 0%, 100% { height: 24px; } 50% { height: 12px; } }
      @keyframes eq-5 { 0%, 100% { height: 14px; } 50% { height: 28px; } }

      @keyframes glow-shift {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1.0; }
      }

      .island-rect {
        animation: island-morph 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        fill: #090c13;
        stroke: #38bdf8;
        stroke-width: 1.5;
        stroke-opacity: 0.5;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
      }

      .glow-layer {
        animation: glow-shift 4s ease-in-out infinite;
      }

      .p-dot {
        animation: pulse-dot 2s ease-in-out infinite;
      }

      .eq-bar {
        transform-origin: bottom;
        fill: #38bdf8;
      }
      .b1 { animation: eq-1 0.8s ease-in-out infinite; }
      .b2 { animation: eq-2 0.7s ease-in-out infinite; }
      .b3 { animation: eq-3 0.9s ease-in-out infinite; }
      .b4 { animation: eq-4 0.65s ease-in-out infinite; }
      .b5 { animation: eq-5 0.75s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="280" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radial Glow Behind Island -->
  <ellipse cx="440" cy="20" rx="280" ry="120" fill="url(#island-glow)" class="glow-layer"/>

  <!-- Morphing Island Capsule -->
  <g id="island-group">
    <rect class="island-rect" width="320" height="48" rx="24"/>
    
    <!-- Camera Sensor -->
    <circle cx="310" cy="40" r="6" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Green Privacy Indicator LED -->
    <circle cx="330" cy="40" r="4" fill="#22c55e" class="p-dot"/>
    
    <!-- Island Audio Equalizer Waveform -->
    <g transform="translate(520, 52)">
      <rect x="0" y="-12" width="3" height="12" rx="1.5" class="eq-bar b1"/>
      <rect x="6" y="-18" width="3" height="18" rx="1.5" class="eq-bar b2"/>
      <rect x="12" y="-10" width="3" height="10" rx="1.5" class="eq-bar b3"/>
      <rect x="18" y="-22" width="3" height="22" rx="1.5" class="eq-bar b4"/>
      <rect x="24" y="-14" width="3" height="14" rx="1.5" class="eq-bar b5"/>
    </g>

    <!-- Island Title Inside Pill -->
    <text x="420" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      NOTCHPYX
    </text>
  </g>

  <!-- Big Hero Typography -->
  <text x="440" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-0.5">
    Dynamic Island for Windows 11
  </text>

  <!-- Subtitle -->
  <text x="440" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Fluid spring animations · Click-through top bezel · Seven workspaces · 0 runtime package deps
  </text>

  <!-- Badges Row -->
  <g transform="translate(195, 210)">
    <!-- RAM Badge -->
    <rect x="0" y="0" width="155" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4.5" fill="#34d399"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">
      RAM: ~20 MB IDLE
    </text>

    <!-- Win32 RGN Badge -->
    <rect x="170" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="186" cy="16" r="4.5" fill="#38bdf8"/>
    <text x="198" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">
      WIN32 REGION RGN
    </text>

    <!-- Author Badge -->
    <rect x="340" y="0" width="155" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="356" cy="16" r="4.5" fill="#a5b4fc"/>
    <text x="368" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ede9fe">
      BY ARYAN PANDEY
    </text>
  </g>
</svg>
